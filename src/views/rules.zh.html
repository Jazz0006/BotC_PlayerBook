<div class="ruleStage">
      <img class="ruleBackdrop" src="{{asset:rules}}" alt="" aria-hidden="true">
      <div class="ruleContent">
        <div class="ruleSigil" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="softFill" cx="12" cy="12" r="6.8"/><circle cx="12" cy="12" r="6.8"/><path d="M12 6.9v5.2l3.2 2.1"/><path d="M12 4.9v1.3M12 17.8v1.3M4.9 12h1.3M17.8 12h1.3"/><path d="M7.6 7.6l.9.9M15.5 15.5l.9.9M16.4 7.6l-.9.9M8.5 15.5l-.9.9"/></svg></div>
        <p class="ruleKicker">血染钟楼 · 快速开始</p>
        <h2 class="ruleTitle">最简单的游戏规则</h2>
        <div class="factionGoals">
          <div class="factionGoal good">
            <span class="factionEmblem" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="softFill" cx="12" cy="12" r="7"/><path d="M12 4.2v2.1M12 17.7v2.1M4.2 12h2.1M17.7 12h2.1M6.5 6.5 8 8M16 16l1.5 1.5M17.5 6.5 16 8M8 16l-1.5 1.5"/><circle cx="12" cy="12" r="4.1"/></svg></span>
            <b>好人</b><span>让恶魔死亡</span>
          </div>
          <div class="factionGoal evil">
            <span class="factionEmblem" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="hotFill" d="M12.2 3.8c3.6 3.3 5.3 6.3 5.3 9.4 0 4-2.6 6.9-5.5 6.9s-5.5-2.9-5.5-6.5c0-2.2 1.2-4 3.1-5.7-.1 1.8.4 3.1 1.4 3.9.1-2.6.6-5.1 1.2-8Z"/><path d="M12.2 3.8c3.6 3.3 5.3 6.3 5.3 9.4 0 4-2.6 6.9-5.5 6.9s-5.5-2.9-5.5-6.5c0-2.2 1.2-4 3.1-5.7-.1 1.8.4 3.1 1.4 3.9.1-2.6.6-5.1 1.2-8Z"/><path d="M9.7 15.2c.7.7 1.4 1 2.3 1s1.6-.3 2.3-1"/></svg></span>
            <b>邪恶</b><span>保护恶魔<br>直到场上只剩 2 人</span>
          </div>
        </div>
        <div class="deathRule">
          <strong>死亡不等于出局</strong>
          <span>死亡后仍可讨论，并保留最后一次投票机会。</span>
        </div>
        <div class="exampleSetup" aria-label="5 人游戏示例配置：3 镇民、1 爪牙、1 恶魔">
          <p class="exampleSetupTitle">5 人游戏示例配置</p>
          <div class="exampleSetupRoles">
            <span class="setupRole town"><i class="setupRoleIcon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="softFill" cx="12" cy="12" r="7"/><path d="M12 4.2v2.1M12 17.7v2.1M4.2 12h2.1M17.7 12h2.1M6.5 6.5 8 8M16 16l1.5 1.5M17.5 6.5 16 8M8 16l-1.5 1.5"/><circle cx="12" cy="12" r="4.1"/></svg></i><span><b>3</b> 镇民</span></span>
            <span class="setupRole minion"><i class="setupRoleIcon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="warmFill" d="M7.4 5.8 18.2 16.6 16.7 18.1 5.9 7.3Z"/><path d="m5.6 5.6 12.8 12.8M15.7 6.4l1.9 1.9-9.3 9.3-2.1.5.5-2.1 9-9.6Z"/><path d="M14.3 7.7 16.3 9.7"/></svg></i><span><b>1</b> 爪牙</span></span>
            <span class="setupRole demon"><i class="setupRoleIcon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="hotFill" d="M12.2 3.8c3.6 3.3 5.3 6.3 5.3 9.4 0 4-2.6 6.9-5.5 6.9s-5.5-2.9-5.5-6.5c0-2.2 1.2-4 3.1-5.7-.1 1.8.4 3.1 1.4 3.9.1-2.6.6-5.1 1.2-8Z"/><path d="M12.2 3.8c3.6 3.3 5.3 6.3 5.3 9.4 0 4-2.6 6.9-5.5 6.9s-5.5-2.9-5.5-6.5c0-2.2 1.2-4 3.1-5.7-.1 1.8.4 3.1 1.4 3.9.1-2.6.6-5.1 1.2-8Z"/><path d="M9.7 15.2c.7.7 1.4 1 2.3 1s1.6-.3 2.3-1"/></svg></i><span><b>1</b> 恶魔</span></span>
          </div>
        </div>
        <div class="ruleActions">
          <button class="ruleAction secondary" type="button" onclick="showFlow('5')">查看 5 人最简流程示例</button>
        </div>
      </div>
    </div>
