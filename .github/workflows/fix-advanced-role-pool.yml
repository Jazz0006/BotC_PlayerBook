name: Fix advanced role pool
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'agent/add-intermediate-script'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Fix final role pool
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          final="roleNames:['侍女','赌徒','弄臣','神谕者','洗衣妇','厨师','共情者','占卜师','送葬者','僧侣','守鸦人','杀手','市长','月之子','酒鬼','隐士','圣徒','恶魔辩护人','投毒者','间谍','猩红女巫','普卡','小恶魔']"
          pat=r"(advanced_7_9:\s*\{.*?subtitle:.*?\n\s*)roleNames:\[[^\n]+\]"
          s,n=re.subn(pat,lambda m:m.group(1)+final,s,count=1,flags=re.S)
          assert n==1
          assert final in s
          p.write_text(s,encoding='utf-8')
      - name: Commit and clean up
        run: |
          rm .github/workflows/fix-advanced-role-pool.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-advanced-role-pool.yml
          git commit -m "Fix advanced script role pool" || exit 0
          git push origin HEAD:${{ github.head_ref }}
